services:
  # ============================================
  # SMM Telegram Bot — Background Worker
  # Renderda to'xtovsiz, barqaror ishlaydi
  # ============================================
  - type: web
    name: smm-telegram-bot
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        value: 8721599901:AAGTu4siikElZPkBqgQvGPZEQrvEzZ_ZSSM
      - key: ADMIN_IDS
        value: "8809344628"
      - key: ORDER_GROUP_ID
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: smm-postgres-db
          property: connectionString
      - key: BOT_USERNAME
        value: APEXSMM_BOT
      - key: LOG_LEVEL
        value: INFO

# ============================================
# Doimiy PostgreSQL Bazasi (Persistent Database)
# Server o'chib yonsa ham hech qanday ma'lumot O'CHMAYDI!
# ============================================
databases:
  - name: smm-postgres-db
    databaseName: smm_bot_db
    user: smm_admin
    region: frankfurt
    plan: free
    ipAllowList: []
